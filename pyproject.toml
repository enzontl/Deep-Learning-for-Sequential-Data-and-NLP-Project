[project]
name = "deep-learning-for-sequential-data-and-nlp-project"
version = "0.1.0"
description = "Contract-review assistant on LEDGAR: clause classification with statistical evaluation, retrieval and bias audit"
readme = "README.md"
authors = [
    { name = "enzontl", email = "enatali@albertschool.com" }
]
requires-python = ">=3.13"
dependencies = [
    "accelerate>=0.25.0",
    "datasets>=2.16.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pytest>=7.4.0",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "seaborn>=0.12.0",
    "sentence-transformers>=2.3.0",
    "torch>=2.0.0",
    "tqdm>=4.65.0",
    "transformers>=4.35.0",
]

[project.scripts]
deep-learning-for-sequential-data-and-nlp-project = "deep_learning_for_sequential_data_and_nlp_project:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
